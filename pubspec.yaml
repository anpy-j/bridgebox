name: bridgebox
description: 桥坞 — 跨端 SSH 服务器与 Docker 管理客户端（手机 / 桌面）。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.13.0
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
